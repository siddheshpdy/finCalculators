<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      (function () {
        var redirectTarget = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?p=' + encodeURIComponent(redirectTarget));
      })();
    </script>
  </head>
  <body></body>
  </html>
